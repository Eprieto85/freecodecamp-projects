<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EP Tech Gallery — CSS Flexbox by Edisson Prieto." />
    <title>EP Tech Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="lang-bar">
      <span data-i18n="lang_label">Language:</span>
      <button onclick="setLang('en')" class="lang-btn" id="btn-en">EN</button>
      <button onclick="setLang('es')" class="lang-btn" id="btn-es">ES</button>
      <button onclick="setLang('fr')" class="lang-btn" id="btn-fr">FR</button>
    </div>

    <header>
      <h1>EP Tech Gallery</h1>
      <p data-i18n="subtitle">A visual collection of web development technologies</p>
    </header>

    <div class="gallery">
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/1.jpg" alt="HTML5" loading="lazy" />
        <figcaption data-i18n="cap1">HTML5 — Structure</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/2.jpg" alt="CSS3" loading="lazy" />
        <figcaption data-i18n="cap2">CSS3 — Style</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/3.jpg" alt="JavaScript" loading="lazy" />
        <figcaption data-i18n="cap3">JavaScript — Logic</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/4.jpg" alt="Flexbox" loading="lazy" />
        <figcaption data-i18n="cap4">Flexbox — Layout</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/5.jpg" alt="CSS Grid" loading="lazy" />
        <figcaption data-i18n="cap5">CSS Grid — Grids</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/6.jpg" alt="Responsive Design" loading="lazy" />
        <figcaption data-i18n="cap6">Responsive Design</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/7.jpg" alt="Animations" loading="lazy" />
        <figcaption data-i18n="cap7">CSS Animations</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/8.jpg" alt="Accessibility" loading="lazy" />
        <figcaption data-i18n="cap8">Accessibility</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/9.jpg" alt="Git & GitHub" loading="lazy" />
        <figcaption data-i18n="cap9">Git &amp; GitHub</figcaption>
      </figure>
    </div>

    <footer>
      <p data-i18n="footer">EP Tech Gallery · <strong>Edisson Prieto</strong> · CSS Flexbox · <a href="https://github.com/Eprieto85">GitHub</a></p>
    </footer>

    <script>
      const translations = {
        en: {
          lang_label: "Language:",
          subtitle: "A visual collection of web development technologies",
          cap1: "HTML5 — Structure", cap2: "CSS3 — Style", cap3: "JavaScript — Logic",
          cap4: "Flexbox — Layout", cap5: "CSS Grid — Grids", cap6: "Responsive Design",
          cap7: "CSS Animations", cap8: "Accessibility", cap9: "Git & GitHub",
          footer: "EP Tech Gallery · Edisson Prieto · CSS Flexbox · GitHub"
        },
        es: {
          lang_label: "Idioma:",
          subtitle: "Una colección visual de tecnologías de desarrollo web",
          cap1: "HTML5 — Estructura", cap2: "CSS3 — Estilo", cap3: "JavaScript — Lógica",
          cap4: "Flexbox — Layout", cap5: "CSS Grid — Cuadrículas", cap6: "Diseño Responsivo",
          cap7: "Animaciones CSS", cap8: "Accesibilidad", cap9: "Git y GitHub",
          footer: "EP Tech Gallery · Edisson Prieto · CSS Flexbox · GitHub"
        },
        fr: {
          lang_label: "Langue :",
          subtitle: "Une collection visuelle de technologies de développement web",
          cap1: "HTML5 — Structure", cap2: "CSS3 — Style", cap3: "JavaScript — Logique",
          cap4: "Flexbox — Mise en page", cap5: "CSS Grid — Grilles", cap6: "Design Responsif",
          cap7: "Animations CSS", cap8: "Accessibilité", cap9: "Git et GitHub",
          footer: "EP Tech Gallery · Edisson Prieto · CSS Flexbox · GitHub"
        }
      };
      function setLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang][key] !== undefined) el.innerHTML = translations[lang][key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        document.documentElement.lang = lang;
      }
      setLang('en');
    </script>
  </body>
</html>
