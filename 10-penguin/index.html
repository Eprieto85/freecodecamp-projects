<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EP Penguin — CSS Transforms by Edisson Prieto." />
    <title>EP Penguin — CSS Transforms</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <div class="lang-bar">
      <span data-i18n="lang_label">Language:</span>
      <button onclick="setLang('en')" class="lang-btn" id="btn-en">EN</button>
      <button onclick="setLang('es')" class="lang-btn" id="btn-es">ES</button>
      <button onclick="setLang('fr')" class="lang-btn" id="btn-fr">FR</button>
    </div>

    <div class="left-mountain"></div>
    <div class="back-mountain"></div>
    <div class="sun"></div>

    <div class="penguin" onclick="this.classList.toggle('wave')">
      <div class="penguin-head">
        <div class="face left"></div>
        <div class="face right"></div>
        <div class="chin"></div>
        <div class="eye left">
          <div class="eye-lid"></div>
        </div>
        <div class="eye right">
          <div class="eye-lid"></div>
        </div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="beak top"></div>
        <div class="beak bottom"></div>
      </div>
      <div class="shirt">
        <div>💜</div>
        <p data-i18n="shirt_text">I CSS</p>
      </div>
      <div class="penguin-body">
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="foot left"></div>
        <div class="foot right"></div>
      </div>
    </div>

    <div class="ground"></div>

    <div class="caption">
      <p data-i18n="caption">👆 Click Pedro to make him wave!</p>
    </div>

    <div class="info-bar">
      <span data-i18n="footer">CSS Transforms · <strong>Edisson Prieto</strong> · <a href="https://github.com/Eprieto85">GitHub</a></span>
    </div>

    <script>
      const translations = {
        en: {
          lang_label: "Language:",
          shirt_text: "I CSS",
          caption: "👆 Click Pedro to make him wave!",
          footer: "CSS Transforms · <strong>Edisson Prieto</strong> · <a href='https://github.com/Eprieto85'>GitHub</a>"
        },
        es: {
          lang_label: "Idioma:",
          shirt_text: "Amo CSS",
          caption: "👆 ¡Haz clic en Pedro para que salude!",
          footer: "Transformaciones CSS · <strong>Edisson Prieto</strong> · <a href='https://github.com/Eprieto85'>GitHub</a>"
        },
        fr: {
          lang_label: "Langue :",
          shirt_text: "J'aime CSS",
          caption: "👆 Cliquez sur Pedro pour le faire saluer !",
          footer: "Transformations CSS · <strong>Edisson Prieto</strong> · <a href='https://github.com/Eprieto85'>GitHub</a>"
        }
      };
      function setLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang][key] !== undefined) el.innerHTML = translations[lang][key];
        });
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        document.documentElement.lang = lang;
      }
      setLang('en');
    </script>
  </body>
</html>
