<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EP Piano — Responsive Web Design by Edisson Prieto." />
    <title>EP Piano</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="lang-bar">
      <span data-i18n="lang_label">Language:</span>
      <button onclick="setLang('en')" class="lang-btn" id="btn-en">EN</button>
      <button onclick="setLang('es')" class="lang-btn" id="btn-es">ES</button>
      <button onclick="setLang('fr')" class="lang-btn" id="btn-fr">FR</button>
    </div>

    <header>
      <h1 data-i18n="title">🎹 EP Piano</h1>
      <p data-i18n="subtitle">Responsive Web Design with CSS</p>
    </header>

    <div id="piano">
      <div class="piano-top-bar">
        <span class="piano-brand" data-i18n="brand">EP · Grand</span>
        <span class="piano-model">Model 1988 · Bogotá</span>
      </div>
      <div class="keys">
        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>

        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>

        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>

        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
        <div class="key black--key"></div>
      </div>
    </div>

    <div class="info">
      <p data-i18n="info">Built using <code>position</code>, <code>z-index</code>, <code>media queries</code> and <code>CSS pseudoclasses</code>. Click any key!</p>
    </div>

    <footer>
      <p data-i18n="footer">Responsive Piano · <strong>Edisson Prieto</strong> · <a href="https://github.com/Eprieto85">GitHub</a></p>
    </footer>

    <script>
      const translations = {
        en: {
          lang_label: "Language:", title: "🎹 EP Piano", subtitle: "Responsive Web Design with CSS",
          brand: "EP · Grand",
          info: "Built using <code>position</code>, <code>z-index</code>, <code>media queries</code> and <code>CSS pseudoclasses</code>. Click any key!",
          footer: "Responsive Piano · Edisson Prieto · GitHub"
        },
        es: {
          lang_label: "Idioma:", title: "🎹 EP Piano", subtitle: "Diseño Web Responsivo con CSS",
          brand: "EP · Gran Cola",
          info: "Construido con <code>position</code>, <code>z-index</code>, <code>media queries</code> y <code>pseudoclases CSS</code>. ¡Haz clic en una tecla!",
          footer: "Piano Responsivo · Edisson Prieto · GitHub"
        },
        fr: {
          lang_label: "Langue :", title: "🎹 EP Piano", subtitle: "Design Web Responsif avec CSS",
          brand: "EP · Grand",
          info: "Construit avec <code>position</code>, <code>z-index</code>, <code>media queries</code> et <code>pseudoclasses CSS</code>. Cliquez sur une touche !",
          footer: "Piano Responsif · Edisson Prieto · GitHub"
        }
      };
      function setLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang][key] !== undefined) el.innerHTML = translations[lang][key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        document.documentElement.lang = lang;
      }
      setLang('en');

      // Click sound effect (visual feedback)
      document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('mousedown', () => key.style.filter = 'brightness(0.75)');
        key.addEventListener('mouseup', () => key.style.filter = '');
        key.addEventListener('mouseleave', () => key.style.filter = '');
      });
    </script>
  </body>
</html>
